[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "terrazzo"
version = "0.3.0"
description = "Terrazzo — local LLM inference for Apple Silicon (paged KV scheduling + continuous batching on MLX)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "mlx>=0.32.4,<0.33",
    "mlx-lm>=0.31.3,<0.32",
]

[project.scripts]
terrazzo = "terrazzo.cli:main"

[tool.setuptools.packages.find]
include = ["terrazzo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
